  function renderOrder(id){const o=db.orders.find(x=>x.id===id);if(!o||!canViewOrder(o))return notFound('This order is not available in your current demo profile.');const status=aggregateStatus(o),path=['Pending','Confirmed','Processing','Shipped','Delivered'],u=currentUser(),artisanOnly=u.role==='artisan'&&o.customerId!==u.id,items=artisanOnly?orderItems(o,u.artisanId):o.items;return `<div class="page container">${breadcrumb([['My Orders','#orders'],[o.id]])}<div class="page-heading"><span class="eyebrow">A story in the making</span><h1>Your order, a little closer.</h1><p>${esc(o.id)} &middot; Placed ${dateLabel(o.createdAt)} &middot; ${esc(o.payment)}</p></div><div class="cart-layout"><div><div class="between"><h2 style="font-size:30px">The journey so far.</h2>${statusBadge(status)}</div>${status==='Cancelled'?'<div class="demo-note mt">This demo order has been cancelled. Its stock has been restored.</div>':`<div class="tracking">${path.map((s,i)=>`<div class="track-step ${i<=path.indexOf(status)?'complete':''}">${s}</div>`).join('')}</div>`}<p class="small muted" style="font-size:10px;margin-bottom:26px">${status==='Delivered'?'Your demo order is marked delivered. No physical shipment took place.':'Simulated tracking only. The artisan can update their fulfilment status in the demo workspace.'}</p>${items.map(i=>`<div class="cart-item"><img src="${safeImage(i.image)}" alt="${esc(i.name)}"><div><h3>${esc(i.name)}</h3><p class="product-artisan">Quantity ${i.qty} &middot; ${money(i.price)} each</p>${statusBadge(o.fulfillments[i.artisanId]||status)}</div><div class="price">${money(i.price*i.qty)}</div></div>`).join('')}${o.customerId===u.id&&Object.values(o.fulfillments).every(s=>['Pending','Confirmed'].includes(s))?`<button class="text-btn danger mt" data-action="cancel-order" data-id="${esc(o.id)}">Cancel demo order</button>`:''}</div><aside class="cart-summary"><h2>Delivery details.</h2><address class="address-block" style="font-style:normal"><strong>${esc(o.shippi   function renderJoin(){const u=currentUser(),app=u?.applicationId?db.applications.find(a=>a.id===u.applicationId):null;return `<div class="page container">${breadcrumb([['Become an Artisan']])}<div class="auth-layout"><div class="auth-intro"><span class="eyebrow">Made by you. Seen by the world.</span><h1>Your hands create.<br>Your story connects.</h1><p>Bring your craft to TANABANA. Start with a simple introduction, then try your own product and order workspace.</p><div class="stack" style="gap:16px;margin:28px 0">${[['A corner that is yours','A profile for your craft, your process, and your voice.'],['Prices with a purpose','Show the materials and time behind every creation.'],['One simple workspace','Manage listings, demo orders, and your story.']].map(([h,p])=>`<div><h3 style="font-size:25px">${h}</h3><p class="small muted" style="font-size:10px;margin-top:5px">${p}</p></div>`).join('')}</div>${demoNote('Applications are saved locally. A demo admin can approve or reject them in this browser; no real review or identity verification takes place.')}<img class="auth-image" src="${photo(6634715)}" alt="Hands working with threads on a loom"></div><div class="form-surface"><h2>Let us meet the maker.</h2><p>A few details are all it takes to start your demo application.</p>${app?`<div class="demo-note mb">Your application is ${statusBadge(app.status)}. <a href="#dashboard/overview">View your application workspace</a></div>`:''}<form id="join-form"><div class="form-error" role="alert"></div><div class="field"><label for="join-name">Artisan name *</label><input id="join-name" name="name" required minlength="2" maxlength="80"></div><div class="field-row"><div class="field"><label for="join-email">Email *</label><input id="join-email" name="email" type="email" required maxlength="150"></div><div class="field"><label for="join-phone">Phone number *</label><input id="join-phone" name="phone" type="tel" pattern="[6-9][0-9]{9}" title="10-digit Indian mobile number" required></di   function renderDashboard(section='overview',params=new URLSearchParams()){const u=currentUser();if(!u||!['artisan','applicant'].includes(u.role))return accessScreen('A home for your handmade business.','Choose the artisan demo profile or submit an artisan application to open this workspace.');if(u.role==='applicant'){const app=db.applications.find(x=>x.id===u.applicationId);return workspaceShell('artisan','overview',`${workspaceTitle('A new story is taking shape.','Your local artisan application')}<h2 style="font-size:31px;margin-bottom:18px">Hello, ${esc(u.name)}.</h2>${statusBadge(app?.status||'Pending')}<p class="muted" style="font-size:12px;line-height:2;margin:20px 0">${app?.status==='Rejected'?'Your illustrative application was rejected by the demo admin. You can submit a new application with a different demo email, or try the preloaded artisan workspace.':'Your application is waiting for a demo review. Switch to the admin workspace, open Applications, and approve it. Then reopen your saved profile using your application email.'}</p><div class="button-group"><button class="btn" data-action="demo-login" data-role="admin">Try the admin review ${icon('arrow',16)}</button><a class="btn btn-outline" href="#login">Switch demo profile</a></div><p class="small muted mt">Application: ${esc(app?.id)}<br>Email: ${esc(u.email)}<br>No application has been sent to a real organization.</p>`);}

  function productsTable(products,admin=false){if(!products.length)return emptyState('A blank canvas. A world of possibility.','Add your first demo product and tell its story.','Add a product','#dashboard/add','box');return `<div class="data-table-wrap"><table class="data-table"><thead><tr><th>Your creation</th>${admin?'<th>Demo artisan</th>':''}<th>Price</th><th>Stock</th><th>Listing</th><th>Actions</th></tr></thead><tbody>${products.map(p=>`<tr><td><div class="table-product"><img src="${safeImage(p.image)}" alt=""><strong>${esc(p.name)}</strong></div></td>${admin?`<td>${esc(getArtisan(p.artisanId)?.name||'Unknown')}</td>`:''}<td>${money(p.price)}</td><td>${p.stock}</td><td>${statusBadge(p.published?'Published':p.moderationBlocked?'Paused':'Draft')}</td><td><div class="table-actions">${admin?`<button class="btn btn-outline btn-sm" data-action="moderate-product" data-id="${esc(p.id)}">${p.moderationBlocked?'Restore':'Pause'}</button>`:`<a class="icon-btn" href="#dashboard/add?edit=${encodeURIComponent(p.id)}" aria-label="Edit ${esc(p.name)}">${icon('edit',14)}</a><button class="icon-btn" data-action="toggle-publish" data-id="${esc(p.id)}" aria-label="${p.published?'Unpublish':'Publish'} ${esc(p.name)}">${icon(p.published?'eye':'plus',14)}</button><button class="icon-btn danger" data-action="delete-product" data-id="${esc(p.id)}" aria-label="Delete ${esc(p.name)}">${icon('trash',14)}</button>`}${p.published?`<a class="icon-btn" href="#product/${encodeURIComponent(p.id)}" aria-label="View ${esc(p.name)}">${icon('arrow',14)}</a>`:''}</div></td></tr>`).join('')}</tbody></table></div>`;}
  function productForm(p){return `${workspaceTitle(p?'A little refinement.':'Something beautiful, made by you.',p?'Update the details of your demo listing.':'Tell us about the piece, the process, and a fair price.')}<form id="product-form" class="product-form" data-id="${esc(p?.id||'')}"><div class="form-error" role="alert"></div><h2 class="form-section-title" style="margin-top:0">The creation.</h2><div class="field"><label for="prod-name">Product name *</label><input id="prod-name" name="name" required minlength="4" maxlength="120" value="${esc(p?.name||'')}" placeholder="A clear, descriptive name"></div><div class="field"><label for="prod-description">Product description *</label><textarea id="prod-description" name="description" required minlength="25" maxlength="2000">${esc(p?.description||'')}</textarea></div><div class="field-row"><div class="field"><label for="prod-category">Craft category *</label><select id="prod-category" name="category" required><option value="">Select a craft</option>${categoryOptions(p?.category)}</select></div><div class="field"><label for="prod-stock">Available quantity *</label><input id="prod-stock" name="stock" type="number" min="0" max="9999" step="1" required value="${p?.stock??1}"></div></div><div class="field-row"><div class="field"><label for="prod-materials">Materials *</label><input id="prod-materials" name="materials" required minlength="3" maxlength="250" value="${esc(p?.materials||'')}" placeholder="e.g. Cotton, cotton embroidery thread"></div><div class="field"><label for="prod-dimensions">Dimensions *</label><input id="prod-dimensions" name="dimensions" required minlength="3" maxlength="100" value="${esc(p?.dimensions||'')}" placeholder="e.g. 40 x 40 cm"></div></div><div class="field-row"><div class="field"><label for="prod-image">Photo URL</label><input id="prod-image" name="image" type="url" value="${esc(p?.image?.startsWith('http')?p.image:'')}" placeholder="https://..."><small>A public HTTP(S) image, or upload a file below. A photo is required.</small></div><div class="field"><label for="prod-photo">Or upload a product photo</label><input id="prod-photo" name="photo" type="file" accept="image/jpeg,image/png,image/webp"><small>JPEG, PNG, WebP. Up to 5 MB, compressed locally.</small></div></div>${p?.image?`<img src="${safeImage(p.image)}" alt="Current product photo" style="width:110px;height:110px;border-radius:4px;margin-bottom:20px">`:''}<h2 class="form-section-title">The story woven in.</h2><div class="field-row"><div class="field"><label for="prod-technique">Craft technique *</label><input id="prod-technique" name="technique" required minlength="3" maxlength="150" value="${esc(p?.technique||'')}"></div><div class="field"><label for="prod-time">Creation time *</label><input id="prod-time" name="creationTime" required minlength="2" maxlength="100" value="${esc(p?.creationTime||'')}" placeholder="e.g. 8 hours over 2 days"></div></div><div class="field"><label for="prod-story">The product's craft story *</label><textarea id="prod-story" name="story" required minlength="30" maxlength="3000" placeholder="Share the process, a little inspiration, and the care behind your piece.">${esc(p?.story||'')}</textarea></div><div class="field"><label for="prod-inspiration">Design inspiration *</label><input id="prod-inspiration" name="inspiration" required minlength="5" maxlength="300" value="${esc(p?.inspiration||'')}"></div><div class="field"><label for="prod-care">Care instructions *</label><textarea id="prod-care" name="care" required minlength="10" maxlength="700">${esc(p?.care||'')}</textarea></div><h2 class="form-section-title">A price with purpose.</h2><div class="cost-fields">${[['materialsCost','Materials'],['labourCost','Artisan labour'],['packagingCost','Finishing & packaging'],['platformFee','Platform fee']].map(([key,label])=>`<div class="field"><label for="cost-${key}">${label} (INR) *</label><input id="cost-${key}" type="number" name="${key}" min="0" max="1000000" step="1" required data-cost value="${p?.[key]??0}"></div>`).join('')}</div><div class="field" style="max-width:300px"><label for="prod-price">Final listed price (INR) *</label><input id="prod-price" name="price" type="number" min="1" max="1000000" step="1" required data-cost value="${p?.price||''}"></div><div class="cost-calculator" id="cost-calculator">${p?`Breakdown total: ${money(p.price)}. Your price adds up.`:'Add your costs, then use their total as your listed price.'}</div><button class="text-btn indigo" type="button" data-action="use-total" style="margin-bottom:25px">Use breakdown total as my price</button><div class="demo-note mb">All listings are illustrative demo content. Do not make unsupported claims of authenticity, certification, or cultural significance.</div><div class="button-group"><button type="submit" class="btn btn-outline" name="intent" value="draft">Save as draft</button><button type="submit" class="btn" name="intent" value="publish">${p?'Save & publish':'Publish demo product'} ${icon('arrow',16)}</button><a href="#dashboard/products" class="text-btn" style="margin-left:8px">Cancel</a></div></form>`;}
  function artisanProfileForm(a,u){return `${workspaceTitle('The person behind the pieces.','Keep your demo studio details up to date.')}<form id="artisan-profile-form" class="product-form"><div class="form-error" role="alert"></div><div class="field-row"><div class="field"><label for="artisan-name">Artisan name *</label><input id="artisan-name" name="name" required minlength="2" maxlength="80" value="${esc(a.name)}"></div><div class="field"><label for="artisan-email">Email *</label><input id="artisan-email" type="email" name="email" required value="${esc(u.email)}"></div></div><div class="field-row"><div class="field"><label for="artisan-phone">Phone *</label><input id="artisan-phone" type="tel" name="phone" required pattern="[6-9][0-9]{9}" title="10-digit Indian mobile number" value="${esc(u.phone||'')}"></div><div class="field"><label for="artisan-category">Primary craft *</label><select id="artisan-category" name="category" required>${categoryOptions(a.category)}</select></div></div><div class="field-row"><div class="field"><label for="artisan-state">State *</label><select id="artisan-state" name="state" required>${stateOptions(a.state)}</select></div><div class="field"><label for="artisan-city">City *</label><input id="artisan-city" name="city" required minlength="2" maxlength="60" value="${esc(a.city)}"></div></div><div class="field-row"><div class="field"><label for="artisan-experience">Years of experience</label><input id="artisan-experience" name="experience" type="number" min="0" max="80" value="${a.experience||0}"></div><div class="field"><label for="artisan-photo">Replace profile photograph</label><input id="artisan-photo" name="photo" type="file" accept="image/jpeg,image/png,image/webp"></div></div><button class="btn">Save studio details ${icon('check',16)}</button></form>`;}
  const statusTransitions={Pending:['Confirmed','Cancelled'],Confirmed:['Processing','Cancelled'],Processing:['Shipped','Cancelled'],Shipped:['Delivered'],Delivered:[],Cancelled:[]};
  function ordersTable(orders,artisanId){const rows=orders.flatMap(o=>(artisanId?[artisanId]:[...new Set(o.items.map(i=>i.artisanId))]).map(aid=>({o,aid})));return `<div class="data-table-wrap"><table class="data-table"><thead><tr><th>Order / Date</th><th>Creation / Quantity</th><th>Item total</th><th>Delivery</th><th>Fulfilment status</th></tr></thead><tbody>${rows.map(({o,aid})=>{const items=orderItems(o,aid),status=o.fulfillments[aid]||'Pending';return `<tr><td><strong class="indigo">${esc(o.id)}</strong><br><span class="muted">${dateLabel(o.createdAt)}</span>${!artisanId?`<br><span class="muted">${esc(getArtisan(aid)?.name||'Former artisan')}</span>`:''}</td><td style="min-width:170px;max-width:250px">${items.map(i=>`${esc(i.name)} <strong>&times; ${i.qty}</strong>`).join('<br>')}</td><td>${money(items.reduce((s,i)=>s+i.qty*i.price,0))}</td><td>${esc(o.shipping.city)}<br><button class="text-btn" style="font-size:9px" data-action="order-details" data-id="${esc(o.id)}">View details</button></td><td><select class="table-select" data-order-status="${esc(o.id)}" data-artisan-id="${esc(aid)}" aria-label="Update fulfilment for ${esc(o.id)}" ${!statusTransitions[status]?.length?'disabled':''}><option value="${status}">${status}</option>${(statusTransitions[status]||[]).map(s=>`<option value="${s}">${s}</option>`).join('')}</select></td></tr>`;}).join('')}</tbody></table></div>`;}
  function salesChart(orders,artisanId){const now=new Date(),months=Array.from({length:6},(_,i)=>new Date(now.getFullYear(),now.getMonth()-5+i,1));const values=months.map(m=>orders.filter(o=>{const d=new Date(o.createdAt);return d.getFullYear()===m.getFullYear()&&d.getMonth()===m.getMonth()&&o.fulfillments[artisanId]!=='Cancelled';}).reduce((s,o)=>s+orderItems(o,artisanId).reduce((t,i)=>t+i.price*i.qty,0),0));const max=Math.max(...values,1);return `<div class="chart" role="img" aria-label="Monthly demo sales: ${months.map((m,i)=>m.toLocaleDateString('en-IN',{month:'short'})+' '+money(values[i])).join(', ')}">${values.map((v,i)=>`<div class="chart-column" title="${months[i].toLocaleDateString('en-IN',{month:'long'})}: ${money(v)}"><div class="chart-bar" style="height:${Math.max(2,v/max*100)}%"></div></div>`).join('')}</div><div class="chart-labels">${months.map(m=>`<span>${m.toLocaleDateString('en-IN',{month:'short'})}</span>`).join('')}</div>`;}
  function renderHelp(){return `${workspaceTitle('A little guidance goes a long way.','Simple steps to feel at home in your demo studio.')}<div class="help-list"><details open><summary>How do I add my first product?</summary><p>Open Add Product. Give your piece a clear name, describe what makes it useful, select its craft category, and add stock, materials, and dimensions. Add a photo URL or upload a JPEG, PNG, or WebP file. Complete the story and pricing fields, then save a draft or publish. Published listings appear immediately in this browser's catalogue.</p></details><details><summary>How should I set my price?</summary><p>Add materials, artisan labour, finishing and packaging, and a platform fee. Use "Use breakdown total as my price" to make the listed price equal these costs. The totals must match. Values are in whole Indian rupees. This demo does not recommend labour rates or fees: choose illustrative amounts yourself.</p></details><details><summary>How do I upload a good photograph?</summary><p>Use a clear photo with soft natural light and a simple background. JPEG, PNG, and WebP images up to 5 MB are accepted and compressed to fit local storage. Only upload images you have permission to use. A URL must begin with http:// or https://. Representative stock photos must not be passed off as an exact product photograph in a real marketplace.</p></details><details><summary>How do I manage orders?</summary><p>Open Orders. Move each fulfilment from Pending to Confirmed, Processing, Shipped, and Delivered. Cancellation is allowed before shipping and restores stock once. Each artisan controls only their own fulfilment in this demo interface. Customer order history reflects the slowest active fulfilment. These are local simulations, not carrier events.</p></details><details><summary>How do I test the complete marketplace flow?</summary><p>Use Switch Demo Role to open Customer. Add Meera's cushion to the bag and complete the mock checkout. Switch back to Artisan to see it under Orders, update its status, then open Customer and My Orders to see the change. To test onboarding, submit an application with a new demo email, switch to Admin to approve it, and reopen the saved email profile.</p></details><details><summary>Is this a secure business account?</summary><p>No. Everything is stored in this browser, and anyone can switch to any demo role. There is no backend, secure authentication, real payment gateway, real notification, or production authorization. Do not use real customer data. A production service requires a properly secured server and database.</p></details></div><div class="button-group mt"><a class="btn btn-outline" href="#info/contact">Ask a demo question ${icon('arrow',16)}</a><button class="btn" data-action="run-checks">Check demo data ${icon('check',16)}</button></div>`;}
  function renderAdmin(section='overview'){const u=currentUser();if(u?.role!=='admin')return accessScreen('Behind the threads.','Open the clearly labeled admin demo profile to try local marketplace curation.');let body='';
    if(section==='overview')body=`${workspaceTitle('A thoughtful marketplace starts here.','Your browser-local overview. No real users or transactions.')}<div class="stat-grid">${stat(db.users.length,'Local demo profiles')}${stat(db.artisans.length,'Fictional artisan profiles')}${stat(db.products.length,'Total demo products')}${stat(db.products.filter(p=>p.published).length,'Published listings')}${stat(db.orders.length,'Saved demo orders')}${stat(db.applications.filter(a=>a.status==='Pending').length,'Applications to review')}</div><h2 class="dashboard-heading">A few things that need a human touch.</h2><div class="stack"><a class="link" style="align-self:start" href="#admin/applications">Review artisan applications ${icon('arrow',16)}</a><a class="link" style="align-self:start" href="#admin/products">Look through product listings ${icon('arrow',16)}</a><a class="link" style="align-self:start" href="#admin/orders">View demo orders and fulfilment ${icon('arrow',16)}</a></div><div class="button-group mt"><button class="btn btn-outline" data-action="run-checks">Check demo data ${icon('check',16)}</button><button class="text-btn danger" data-action="reset-demo">Reset local demo data</button></div>`;
    else if(section==='applications')body=`${workspaceTitle('Meet the next makers.','Review fictional applications. Approvals create a local artisan profile.')} ${db.applications.length?db.applications.slice().reverse().map(app=>`<article class="application-item"><div class="between"><div><h3>${esc(app.name)}</h3><span class="small muted" style="font-size:10px">${esc(app.category)} &middot; ${esc(app.city)}, ${esc(app.state)}</span></div>${statusBadge(app.status)}</div><p>${esc(app.bio)}</p><div class="small muted" style="font-size:10px;margin-bottom:17px">${esc(app.email)} &middot; ${esc(app.phone)}<br>Specialization: ${esc(app.specialization)} &middot; ${app.experience||0} illustrative years<br>Submitted ${dateLabel(app.createdAt)}</div>${app.status==='Pending'?`<div class="button-group"><button class="btn btn-sm" data-action="review-application" data-id="${esc(app.id)}" data-status="Approved">Approve demo application ${icon('check',14)}</button><button class="btn btn-outline btn-sm" data-action="review-application" data-id="${esc(app.id)}" data-status="Rejected">Reject</button></div>`:app.status==='Approved'?`<a class="link" href="#artisan/${esc(app.artisanId)}" style="font-size:10px">View the new demo maker ${icon('arrow',14)}</a>`:''}</article>`).join(''):'<p class="muted small">No applications yet.</p>'}`;
    else if(section==='products')body=`${workspaceTitle('Carefully curated, not just collected.','Pause a listing or restore it. These changes are local demo moderation.')} ${productsTable(db.products,true)}`;
    else if(section==='categories')body=`${workspaceTitle('A place for every kind of making.','Add a demo category. Categories in use cannot be removed.')}<form id="category-form" class="row" style="align-items:end;max-width:600px;margin-bottom:25px"><div class="field" style="flex:1;margin:0"><label for="new-category">Category name *</label><input id="new-category" name="name" required minlength="3" maxlength="60" placeholder="A new corner of craft"></div><button class="btn" type="submit">Add ${icon('plus',15)}</button></form><div>${db.categories.map(c=>`<div class="category-manage"><span>${esc(c)} <span class="muted small" style="font-size:9px">(${db.products.filter(p=>p.category===c).length} products)</span></span><button class="icon-btn danger" data-action="remove-category" data-category="${esc(c)}" aria-label="Remove ${esc(c)}">${icon('trash',16)}</button></div>`).join('')}</div>`;
    else if(section==='orders')body=`${workspaceTitle('Every connection, in one place.','One row per artisan fulfilment. Order totals include snapshot prices.')} ${db.orders.length?ordersTable(db.orders.slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt))):'<p class="muted small">No demo orders have been placed.</p>'}`;
    else if(section==='users')body=`${workspaceTitle('People, not passwords.','These are unverified local demo profiles, not authenticated users.')}<div class="data-table-wrap"><table class="data-table"><thead><tr><th>Name</th><th>Demo email</th><th>Local role</th></tr></thead><tbody>${db.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${statusBadge(u.role)}</td></tr>`).join('')}</tbody></table></div>`;
    else return notFound('That admin view does not exist.');
    return workspaceShell('admin',section,body);
  }
  function renderInfo(type){const content={
    about:['A closer connection to craft.','TANABANA explores a simple idea: the things we buy mean more when we understand who made them. This college hackathon project imagines a direct digital marketplace where artisans can show their work, set transparent prices, and share their process.','Every Thread Tells a Story.','The marketplace, makers, prices, and orders in this application are illustrative. Artisan names and biographies are fictional. Stock photographs are representative, and do not prove provenance or identify the fictional makers. The general Kasuti context linked in Craft Stories is separately sourced.'],
    shipping:['A thoughtful journey, imagined.','This is a demo marketplace. No physical goods are sold or shipped. The checkout applies an illustrative delivery charge of INR 99 for baskets below INR 1,999, and complimentary delivery for baskets of INR 1,999 or more.','Follow the demo journey.','Orders move through Pending, Confirmed, Processing, Shipped, and Delivered when the local artisan or admin profile updates them. No tracking number, carrier, delivery estimate, or shipping integration is provided.'],
    returns:['Care for what is made with care.','No real purchases take place in this demo, so no actual return or refund is available. Customers can cancel an entire demo order while every fulfilment is Pending or Confirmed. Artisan cancellation is available before shipping; cancelled quantities are restored once.','A little care goes a long way.','See each product for illustrative care instructions. A real marketplace would need an artisan-agreed return policy, eligibility rules, a customer support process, and refund integration before taking any payment.'],
    privacy:['Your information stays close.','Profile information, uploaded photos, applications, messages, wishlists, carts, and orders are stored in localStorage in this browser. There is no TANABANA server, secure account system, or database. Anyone with access to this browser can view or change the demo data. Do not enter sensitive personal information.','What leaves this page?','Fonts, the styling CDN, and representative photographs load from Google Fonts, jsDelivr, and Pexels. These providers receive ordinary browser requests under their own policies. TANABANA does not send contact forms, newsletter subscriptions, or payments. Reset local data from the admin demo to remove app records.'],
    terms:['Made for exploration, not transactions.','TANABANA is an educational hackathon prototype. All payment choices, orders, shipping events, artisan applications, and admin decisions are simulations. No commercial contract, certification, authenticity guarantee, or real artisan affiliation is established.','Before this becomes a real marketplace.','A production release needs secure authentication, server-side role and ownership checks, transactional stock storage, payment verification, consented artisan content, customer support, and jurisdiction-appropriate legal policies. Browser-only role checks are not security.']
  };if(type==='faq')return `<div class="page container info-page">${breadcrumb([['FAQs']])}<span class="eyebrow">A little clarity</span><h1>A few good questions.</h1><div class="help-list"><details open><summary>Is this a real marketplace?</summary><p>No. This is a functional browser-local hackathon demo. It demonstrates shopping, onboarding, listings, and orders without real transactions.</p></details><details><summary>Are the artisans and products authentic?</summary><p>The six seeded artisans are fictional. Stories, products, time estimates, and prices are illustrative. Photos are representative stock images, not proof of origin. See the separately linked source for general Kasuti craft context.</p></details><details><summary>How do I try a complete order?</summary><p>Explore Crafts, add a product to your bag, and complete checkout using sample details. Choose Demo UPI or Demo Cash on Delivery. No UPI PIN, banking password, or card detail is requested.</p></details><details><summary>How does my data persist?</summary><p>Your data is stored in localStorage in this browser. Refreshing normally preserves it. Clearing site data, private browsing limits, another browser, or another device will not preserve the same records.</p></details><details><summary>How can I try the artisan and admin views?</summary><p>Open Demo Workspaces in the footer or Demo Mode at the top. Choose Artisan or Admin. These are intentionally open role simulations, not secure sign-ins.</p></details></div><a class="link mt" href="#info/contact">Still curious? Leave a demo message ${icon('arrow',16)}</a></div>`;
    if(type==='contact')return `<div class="page container info-page">${breadcrumb([['Contact']])}<span class="eyebrow">Let us keep the conversation going</span><h1>A little hello goes a long way.</h1><p>This form saves a message on this device for presentation purposes. Nothing is emailed or sent to a support team.</p><form id="contact-form" class="form-surface mt"><div class="form-error" role="alert"></div><div class="field-row"><div class="field"><label for="contact-name">Name *</label><input id="contact-name" name="name" required minlength="2" maxlength="80"></div><div class="field"><label for="contact-email">Email *</label><input id="contact-email" type="email" name="email" required maxlength="150"></div></div><div class="field"><label for="contact-message">Your message *</label><textarea id="contact-message" name="message" required minlength="10" maxlength="2000"></textarea></div><button class="btn">Save demo message ${icon('arrow',16)}</button></form></div>`;
    const c=content[type];if(!c)return notFound();return `<div class="page container info-page">${breadcrumb([[type==='about'?'About TANABANA':type.charAt(0).toUpperCase()+type.slice(1)]])}<span class="eyebrow">TANABANA &middot; Every thread tells a story</span><h1>${c[0]}</h1><p>${c[1]}</p><h2>${c[2]}</h2><p>${c[3]}</p><div class="mt">${demoNote('This application is frontend-only. No real authentication, commerce, or backend authorization is implemented.')}</div><a class="link mt" href="#home">Back to TANABANA ${icon('arrow',16)}</a></div>`;

  // Clone before committing so validation or storage failures do not leave partial local changes.
  function changeData(mutate){const next=JSON.parse(JSON.stringify(db));const result=mutate(next);if(!persist(next))throw new Error('The change was not saved. Please check your browser storage.');return result;}
  function requireRole(...roles){const u=currentUser();if(!u||!roles.includes(u.role))throw new Error('Switch to the appropriate demo workspace to perform this action.');return u;}
  function setFormError(form,message){const el=$('.form-error',form);if(el&&form.isConnected){el.textContent=message;el.scrollIntoView({block:'nearest',behavior:'smooth'});}else toast(message,'error');}
  function formValues(form){return Object.fromEntries([...new FormData(form)].map(([k,v])=>[k,typeof v==='string'?v.trim():v]));}
  function validText(value,min,max,label){if(typeof value!=='string'||value.trim().length<min||value.trim().length>max)throw new Error(`${label} must contain ${min} to ${max} characters.`);}
  function validEmail(value){if(typeof value!=='string'||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value))throw new Error('Please enter a valid email address.');}
  function validPhone(value){if(!/^[6-9][0-9]{9}$/.test(value||''))throw new Error('Enter a 10-digit Indian mobile number starting with 6, 7, 8, or 9.');}
  function validInteger(value,min,max,label){const n=Number(value);if(value===''||!Number.isInteger(n)||n<min||n>max)throw new Error(`${label} must be a whole number from ${min} to ${max}.`);return n;}
  function checkUniqueEmail(email,excludeId){validEmail(email);if(db.users.some(u=>u.id!==excludeId&&u.email.toLowerCase()===email.toLowerCase()))throw new Error('A local demo profile already uses this email. Open that saved profile, or use another demo email.');}
  function photoFromFile(file){return new Promise((resolve,reject)=>{if(!file||!file.size)return resolve(null);if(!['image/jpeg','image/png','image/webp'].includes(file.type))return reject(new Error('Please upload a JPEG, PNG, or WebP image.'));if(file.size>5*1024*1024)return reject(new Error('Choose an image smaller than 5 MB.'));const reader=new FileReader();reader.onerror=()=>reject(new Error('The image could not be read. Try another file.'));reader.onload=()=>{const image=new Image();image.onerror=()=>reject(new Error('This image could not be opened. Try another image.'));image.onload=()=>{try{const scale=Math.min(1,960/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff8eb';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.76));}catch(e){reject(new Error('Could not prepare that photo. Please try another.'));}};image.src=reader.result;};reader.readAsDataURL(file);});}

  function runChecks(){
    const results=[],add=(label,pass)=>results.push({label,pass:!!pass});
    add('Twelve sample product definitions are included',seedData().products.length>=12);
    add('At least six fictional artisan profiles are available',db.artisans.length>=6);
    add('Every price breakdown exactly matches its listed price',db.products.every(p=>p.materialsCost+p.labourCost+p.packagingCost+p.platformFee===p.price));
    add('Every stock value is a non-negative whole number',db.products.every(p=>Number.isInteger(p.stock)&&p.stock>=0));
    add('Every product belongs to an existing artisan and category',db.products.every(p=>getArtisan(p.artisanId)&&db.categories.includes(p.category)));
    add('Every order has correct saved item totals and delivery',db.orders.every(o=>o.items.reduce((s,i)=>s+i.price*i.qty,0)===o.subtotal&&o.subtotal+o.delivery===o.total));
    add('Order IDs and checkout tokens are unique',new Set(db.orders.map(o=>o.id)).size===db.orders.length&&new Set(db.orders.filter(o=>o.checkoutToken).map(o=>o.checkoutToken)).size===db.orders.filter(o=>o.checkoutToken).length);
    add('Every fulfilment has a recognized state',db.orders.every(o=>Object.values(o.fulfillments).every(s=>Object.hasOwn(statusTransitions,s))));
    add('Published products can be searched by maker',publishedProducts().every(p=>filterProducts(new URLSearchParams({q:getArtisan(p.artisanId)?.name||''})).some(x=>x.id===p.id)));
    add('Category and availability filters return matching products only',db.categories.every(c=>filterProducts(new URLSearchParams({category:c,stock:'1'})).every(p=>p.category===c&&p.stock>0)));
    const ascending=filterProducts(new URLSearchParams({sort:'price-asc'})),descending=filterProducts(new URLSearchParams({sort:'price-desc'}));
    add('Price sorting is consistent in both directions',ascending.every((p,i)=>i===0||ascending[i-1].price<=p.price)&&descending.every((p,i)=>i===0||descending[i-1].price>=p.price));
    add('Empty, below-threshold, and free-delivery totals are correct',deliveryFor(0)===0&&deliveryFor(1998)===99&&deliveryFor(1999)===0&&deliveryFor(2500)===0);
    add('Completed and cancelled fulfilments cannot move again',statusTransitions.Delivered.length===0&&statusTransitions.Cancelled.length===0);
    add('Saved user emails are unique',new Set(db.users.map(u=>u.email.toLowerCase())).size===db.users.length);
    add('Browser persistence is available',storageAvailable);
    add('Stored records match the current in-memory state',(()=>{try{return localStorage.getItem(STORE_KEY)===JSON.stringify(db);}catch(e){return false;}})());
    openModal('A quick check of the threads.',`<p>Live data and calculation checks. These do not replace end-to-end browser tests or server-side security testing.</p>${results.map(r=>`<div class="test-result ${r.pass?'pass':'fail'}">${icon(r.pass?'check':'close',15)} ${esc(r.label)}</div>`).join('')}<p class="small muted mt" style="font-size:10px">${results.filter(r=>r.pass).length} / ${results.length} checks pass. No production authorization exists in this browser-only demo.</p>`);
  }

    if(action==='demo-info')return openModal('A working demo. An honest one.',`<p>TANABANA is a frontend-only college hackathon prototype. Products, artisans, and stories are illustrative. Your changes persist in this browser using localStorage.</p><div class="help-list"><details open><summary>What actually works?</summary><p>Search, filters, sorting, favourites, cart, mock checkout, stock changes, order tracking, artisan product management, applications, and admin demo actions share the same persistent local records.</p></details><details><summary>What is simulated?</summary><p>Account access, admin authority, payments, fulfilment, contact messages, newsletter sign-ups, and application reviews. There is no secure login, backend API, email service, carrier integration, or payment gateway.</p></details><details><summary>What does a production release need?</summary><p>Server-side authentication and authorization, ownership checks, transactional database operations, verified payment callbacks, approved real artisan content, and suitable policies. A local role flag is never a security boundary.</p></details></div><a class="btn full mt" href="#login">Try a demo workspace ${icon('arrow',16)}</a>`);

  document.addEventListener('submit',async event=>{const form=event.target;if(!form.matches('#search-form,#shop-filters,#newsletter-form,#login-form,#signup-form,#join-form,#profile-form,#artisan-profile-form,#artisan-story-form,#product-form,#checkout-form,#category-form,#contact-form'))return;event.preventDefault();if(!form.reportValidity())return;const error=$('.form-error',form);if(error)error.textContent='';const v=formValues(form),submitter=event.submitter;let workingButton=null;try{

    else if(form.id==='profile-form'){const u=currentUser();if(!u)throw new Error('Choose a local profile first.');validText(v.name,2,80,'Name');checkUniqueEmail(v.email,u.id);if(v.phone)validPhone(v.phone);changeData(next=>{const user=next.users.find(x=>x.id===u.id);Object.assign(user,{name:v.name,email:v.email.toLowerCase(),phone:v.phone});if(user.artisanId){const a=next.artisans.find(a=>a.id===user.artisanId);if(a)a.name=v.name;}});renderHeader();toast('Your local profile details are saved.');}
    else if(form.id==='artisan-story-form'){const u=requireRole('artisan');validText(v.bio,30,2000,'Biography');validText(v.specialization,3,150,'Specialties');changeData(next=>{const a=next.artisans.find(a=>a.id===u.artisanId);Object.assign(a,{bio:v.bio,specialization:v.specialization,quote:v.quote});});toast('Your craft story is saved to your demo profile.');}
    else if(form.id==='artisan-profile-form'){const u=requireRole('artisan');validText(v.name,2,80,'Name');validText(v.city,2,60,'City');validPhone(v.phone);checkUniqueEmail(v.email,u.id);if(!states.includes(v.state)||!db.categories.includes(v.category))throw new Error('Choose an available state and craft.');workingButton=submitter;if(workingButton)workingButton.disabled=true;const image=await photoFromFile(v.photo),experience=validInteger(v.experience||0,0,80,'Experience');requireRole('artisan');changeData(next=>{const user=next.users.find(x=>x.id===u.id),a=next.artisans.find(a=>a.id===u.artisanId);Object.assign(user,{name:v.name,email:v.email.toLowerCase(),phone:v.phone});Object.assign(a,{name:v.name,state:v.state,city:v.city,category:v.category,experience});if(image)a.image=image;});renderHeader();toast('Your demo studio details are saved.');}

  let revealObserver;
  function activateReveals(){revealObserver?.disconnect();if(!('IntersectionObserver'in window)||matchMedia('(prefers-reduced-motion: reduce)').matches){$$('.reveal').forEach(el=>el.classList.add('visible'));return;}revealObserver=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('visible');revealObserver.unobserve(entry.target);}});},{threshold:.08});$$('.reveal').forEach(el=>revealObserver.observe(el));}

    $('#app').innerHTML=html;renderHeader();activateReveals();const titles={home:'Every Thread Tells a Story',shop:'Explore Crafts',product:getProduct(id)?.name||'A Handmade Story',artisans:'Meet the Makers',artisan:getArtisan(id)?.name||'Meet the Maker',stories:'The Story Woven In',story:stories.find(s=>s.id===id)?.title||'Craft Stories',cart:'Your Shopping Bag',checkout:'Demo Checkout',orders:'My Orders',order:'Track Your Demo Order',confirmation:'Your Demo Order Is Saved',wishlist:'Your Favourites',login:'Demo Access',signup:'Create a Demo Profile',join:'Become an Artisan',dashboard:'Artisan Demo Studio',admin:'Admin Demo',profile:'Your Local Profile',info:'A Little About TANABANA'};document.title=`${titles[view]||'Welcome'} | TANABANA`;if(scroll){window.scrollTo({top:0,behavior:'instant'});$('#main-content').focus({preventScroll:true});}}
